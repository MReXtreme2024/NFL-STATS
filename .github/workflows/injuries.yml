# Every Saturday at 9:07am Melbourne time (Friday evening in the US, after the NFL's final
# injury reports): save ESPN's injury report for the playing-time formula test. Doesn't touch the site.
name: Injury report snapshot

on:
  schedule:
    - cron: '7 9 * * 6'                 # Saturday 9:07am
      timezone: 'Australia/Melbourne'   # GitHub adjusts for daylight saving
  workflow_dispatch:                    # adds a "Run workflow" button

permissions:
  contents: write

concurrency:
  group: weekly-update                  # never at the same time as the weekly update
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Save injury report
        run: node updater/injuries.js

      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898341+github-actions[bot]@users.noreply.github.com'
          git add data/injuries
          git commit -m "Injury report: $(TZ=Australia/Melbourne date '+%a %d %b %Y %H:%M')" || echo 'Nothing to commit'
          git pull --rebase
          git push
